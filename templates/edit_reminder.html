<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Edit Reminder</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-dark text-white">
    <div class="container mt-5">
      <div class="card bg-secondary p-4">
        <h2 class="mb-4">Edit Reminder</h2>

        <form method="POST">
          <div class="mb-3">
            <label class="form-label"> Reminder Title </label>

            <input
              type="text"
              name="title"
              class="form-control"
              value="{{ reminder['title'] }}"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label"> Reminder Time </label>

            <input
              type="datetime-local"
              name="reminder_time"
              class="form-control"
              value="{{ reminder['reminder_time'] }}"
              required
            />
          </div>

          <button class="btn btn-primary">Update Reminder</button>
        </form>
      </div>
    </div>
  </body>
</html>
