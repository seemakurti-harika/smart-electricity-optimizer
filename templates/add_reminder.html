<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Add Reminder</title>

    <!-- Bootstrap -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- CSS -->

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <div class="dashboard">
      <!-- SIDEBAR -->

      <aside class="sidebar">
        <div>
          <div class="logo">
            <i class="fa-solid fa-bolt"></i>

            <span>SmartEnergy</span>
          </div>

          <div class="nav-links">
            <a href="/dashboard" class="nav-item">
              <i class="fa-solid fa-house"></i>

              <span>Dashboard</span>
            </a>

            <a href="/history" class="nav-item">
              <i class="fa-solid fa-clock-rotate-left"></i>

              <span>History</span>
            </a>

            <a href="/add_appliance" class="nav-item">
              <i class="fa-solid fa-plus"></i>

              <span>Add Appliance</span>
            </a>

            <a href="/add_reminder" class="nav-item active">
              <i class="fa-solid fa-bell"></i>

              <span>Reminders</span>
            </a>

            <a href="/download_report" class="nav-item">
              <i class="fa-solid fa-file-arrow-down"></i>

              <span>Download Report</span>
            </a>

            <a href="/profile" class="nav-item">
              <i class="fa-solid fa-user"></i>

              <span>Profile</span>
            </a>
          </div>
        </div>

        <a href="/logout" class="logout-btn">
          <i class="fa-solid fa-right-from-bracket"></i>

          Logout
        </a>
      </aside>

      <!-- MAIN CONTENT -->

      <main class="main-content">
        <div class="page-header">
          <h2>Add Smart Reminder</h2>

          <p>Schedule appliance usage reminders</p>
        </div>

        <!-- FORM CARD -->

        <div class="form-card">
          <form method="POST">
            <div class="mb-4">
              <label class="form-label"> Reminder Title </label>

              <input
                type="text"
                name="title"
                class="form-control custom-input"
                placeholder="Example: Turn OFF AC"
                required
              />
            </div>

            <div class="mb-4">
              <label class="form-label"> Reminder Time </label>

              <input
                type="datetime-local"
                name="reminder_time"
                class="form-control custom-input"
                required
              />
            </div>

            <button type="submit" class="submit-btn">
              <i class="fa-solid fa-plus"></i>

              Add Reminder
            </button>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
